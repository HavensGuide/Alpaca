[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-manager"
version = "0.2.0"
description = "A friendly web app for managing Alpaca brokerage accounts, with scheduled orders and price rules."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.30",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "cryptography>=42",
    "pandas>=1.5",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
alpaca-manager = "alpaca_manager.cli:main"

[tool.setuptools.packages.find]
include = ["alpaca_manager*"]

[tool.setuptools.package-data]
alpaca_manager = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
